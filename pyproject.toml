[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instinct-ai"
version = "0.2.0"
description = "Universal System-1 AI Instinct Runtime & Dual-Brain Decision Gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Instinct AI Team" }]
keywords = ["instinct", "instinct-ai", "system-1", "decision-model", "ai", "llm", "agents", "reflex", "dual-brain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/bhavikprit/instinct-ai"
Documentation = "https://github.com/bhavikprit/instinct-ai#readme"
Repository = "https://github.com/bhavikprit/instinct-ai.git"
Issues = "https://github.com/bhavikprit/instinct-ai/issues"

[project.optional-dependencies]
proxy = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "httpx>=0.24.0"]
local = ["onnxruntime>=1.15.0", "numpy>=1.20.0"]
all = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "httpx>=0.24.0", "onnxruntime>=1.15.0", "numpy>=1.20.0"]

[project.scripts]
instinct = "instinct.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instinct*", "reflex*"]
exclude = ["packages*", "reflex_c*", "tests*", "benchmarks*", "examples*"]

[tool.setuptools.package-data]
"instinct.web" = ["*.html"]
"reflex.web" = ["*.html"]
