name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js (for @reflex-ai/sdk)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Compile Native C Engine (libreflex)
      run: |
        make -C reflex_c all
        make -C reflex_c test

    - name: Install Package (Zero-Dependency Core)
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run System Diagnostics (reflex doctor)
      run: |
        python -m reflex.cli doctor

    - name: Run Python Unit Tests & Cross-Language Parity
      run: |
        python -m unittest discover -s tests -v

    - name: Run Edge JavaScript SDK Tests (node --test)
      run: |
        node --test packages/reflex-sdk/test/test_reflex.mjs

    - name: Run DecisionBench Evaluation
      run: |
        python benchmarks/decision_bench.py
