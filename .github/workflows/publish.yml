name: Publish Packages (PyPI & npm)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build wheels and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build sdist and bdist_wheel
      run: |
        python -m build

    - name: Verify distribution archives
      run: |
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  publish-npm:
    name: Publish sys1 to npm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: 'https://registry.npmjs.org'

    - name: Run SDK Tests
      run: node --test packages/reflex-sdk/test/test_reflex.mjs

    - name: Publish to npm
      run: npm publish --access public
      working-directory: packages/reflex-sdk
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
